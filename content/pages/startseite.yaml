faq:
  eyebrow: "Vor dem ersten Schritt"
  title: "Ihre Fragen zum Einstieg"
  items:
    - q: "Für wen ist just OPTIONS gedacht?"
      a: "Für Privatanleger, die Aktien und ETFs kennen und Optionen bewusst einordnen möchten. Sie lernen ein systematisches Vorgehen und entscheiden selbst, ob eine Strategie zu Ihrem Depot passt."
    - q: "Wo beginne ich ohne Optionswissen?"
      a: "Mit dem kostenlosen Starterkit und dem Praxishandbuch. Das Glossar erklärt Fachbegriffe. Ein Optionskonto ist zum Lernen nicht nötig."
    - q: "Erhalte ich konkrete Trade-Empfehlungen?"
      a: "Die Inhalte vermitteln Wissen, Methoden und Risikoregeln. Es gibt keine individuellen Kauf- oder Verkaufsempfehlungen und keine Renditeversprechen."
    - q: "Was gehört zum Starterkit?"
      a: "Der PDF-Leitfaden zu fünf häufigen Anfängerfehlern und der Newsletter mit Wochenausblick und Einordnung. Sie können sich jederzeit abmelden."
