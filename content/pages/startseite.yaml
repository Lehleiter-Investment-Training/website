      link: { label: "Zum eigenen System →", url: "/praxis-workbook/" }
    - index: "03"
      pill: "Prozess verfeinern"
      title: "Ich möchte fundierter entscheiden."
      text: "Nutzen Sie KI für Research und Szenarien. Prüfen Sie Quellen und Ergebnisse, bevor Sie daraus Schlüsse ziehen."
