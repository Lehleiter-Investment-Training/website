      link: { label: "Zum Research-Prozess →", url: "/ki-kurs/" }

pillars:
  eyebrow: "Was sich für Ihr Depot ändert"
  title: "Chancen verstehen.<br>Ihre Grenzen ebenso."
  items:
    - number: "01 / Zusatzerträge"
      title: "Prämien bewusst einordnen"
      text: "Ein Covered Call bringt eine Prämie, begrenzt aber Kursgewinne. Das Verlustrisiko der Aktie bleibt bestehen."
      link: { label: "Covered Calls verstehen →", url: "/covered-call-strategie.html" }
    - number: "02 / Absicherung"
      title: "Schutz mit Kosten abwägen"
      text: "Ein Protective Put kann Verluste der abgesicherten Position begrenzen. Die Prämie kostet Rendite und der Schutz endet mit der Laufzeit."
      link: { label: "Absicherung verstehen →", url: "/protective-put.html" }
    - number: "03 / Bessere Einstiege"
      title: "Einen Kaufpreis festlegen"
      text: "Ein Cash-Secured Put kann den effektiven Einstiegspreis senken. Sie müssen die Aktie aber auch nach einem starken Kursrückgang zum Strike kaufen."
      link: { label: "Einstiege verstehen →", url: "/cash-secured-put.html" }
    - number: "04 / System &amp; Disziplin"
      title: "Entscheidungen vorbereiten"
      text: "Ein Handelsplan macht Regeln überprüfbar. Er nimmt Ihnen keine Entscheidung ab und verhindert nicht jeden Verlust."
      link: { label: "Regeln festhalten →", url: "/handelsplan.html" }

