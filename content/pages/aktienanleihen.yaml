# Themenseite /aktienanleihen/ – das geplante Buch nur mit bestätigten Angaben erwähnen (docs/brand-system.md).
meta:
  title: "Aktienanleihen verstehen – Optionslogik im Depot"
  subtitle: "Was ein Kupon vergütet – und welches Risiko Sie dafür übernehmen."
  description: "Verstehen Sie Kupon, Rückzahlung und Risiken einer Aktienanleihe und die Verbindung zum verkauften Put. Einordnung für Anleger ohne Optionskonto."
intro: "Ein hoher Kupon schützt nicht vor Verlusten. Bei einer klassischen Aktienanleihe kann die Rückzahlung vom Aktienkurs abhängen; zusätzlich tragen Sie das Ausfallrisiko des Emittenten. Prüfen Sie daher Rückzahlungsbedingungen und Basisinformationsblatt, bevor Sie den Zinssatz vergleichen."
sections:
  - title: "Welche Optionslogik steckt darin?"
    html: |
      <p>Das wirtschaftliche Profil einer klassischen Aktienanleihe lässt sich als Kombination aus einer Schuldverschreibung und einem verkauften Put verstehen. Der Kupon hängt unter anderem mit der übernommenen Optionsposition zusammen. Er ist nicht mit einer separat vereinnahmten Optionsprämie gleichzusetzen: Finanzierung, Kosten und Produktbedingungen spielen ebenfalls eine Rolle.</p>
      <p>Liegt der Referenzkurs am Bewertungstag unter dem Basispreis, werden je nach Bedingungen Aktien oder ein entsprechender Geldbetrag geliefert. Deren Wert kann deutlich unter dem eingesetzten Kapital liegen. Über dem Basispreis ist die Rückzahlung bei klassischen Produkten auf den Nennbetrag begrenzt, zuzüglich vereinbarter Zinsen.</p>
      <p class="small-copy">Zur Produktmechanik: <a href="https://derivate.bnpparibas.com/service/produktwissen/handbuch-fuer-anleger/hintergrundwissen-zu-aktienanleihen/" target="_blank" rel="noopener noreferrer">BNP Paribas · Hintergrundwissen zu Aktienanleihen</a>.</p>
  - title: "Vier Fragen vor dem Kauf"
    html: |
      <ul><li>Welche Verluste entstehen, wenn die Aktie stark fällt?</li><li>Wie wird am Bewertungstag zurückgezahlt?</li><li>Welche Kosten und Spreads mindern das Ergebnis?</li><li>Wie beurteilen Sie das Emittentenrisiko?</li></ul>
  - title: "Vom verpackten Produkt zum Verständnis"
    html: |
      <p>Der <a href="/cash-secured-put.html">Cash-Secured Put</a> hilft, die Grundidee zu verstehen. Produktbedingungen, Handel, Kosten und Gegenparteirisiken unterscheiden sich. Ein Vergleich setzt dieselben Laufzeiten, Basispreise und Annahmen voraus.</p>
tip: "<strong>Ein Buch zu Aktienanleihen ist in Planung.</strong> Titel, Umfang, Preis und Veröffentlichungstermin stehen noch nicht fest."
