<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/><text x="360" y="52" font-size="15" fill="#1a1a1a" font-weight="600" text-anchor="middle">Calendar Spread: gleicher Strike, zwei Laufzeiten</text><line x1="150" y1="320" x2="640" y2="320" stroke="#1a1a1a" stroke-width="1.4"/><path d="M644,320 l-9,-4.5 v9 z" fill="#1a1a1a"/><line x1="150" y1="96" x2="150" y2="320" stroke="#cdd2d8" stroke-width="1" stroke-dasharray="4 4"/><text x="150" y="340" font-size="12" fill="#555" font-weight="400" text-anchor="middle">heute</text><text x="640" y="340" font-size="12" fill="#555" font-weight="400" text-anchor="end">Zeit →</text><line x1="150" y1="168" x2="400" y2="168" stroke="#1a1a1a" stroke-width="3"/><circle cx="400" cy="168" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="150" y="154" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">Kurze Option (Verkauf)</text><text x="400" y="154" font-size="12" fill="#555" font-weight="400" text-anchor="middle">Verfall 1</text><line x1="150" y1="262" x2="610" y2="262" stroke="#1a1a1a" stroke-width="3"/><circle cx="610" cy="262" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="150" y="282" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">Lange Option (Kauf)</text><text x="610" y="248" font-size="12" fill="#555" font-weight="400" text-anchor="middle">Verfall 2</text><text x="360" y="304" font-size="12.5" fill="#555" font-weight="400" text-anchor="middle">Die kurze Option verfällt zuerst – ihr Zeitwert zerfällt schneller.</text></svg>