<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/><text x="360" y="52" font-size="15" fill="#1a1a1a" font-weight="600" text-anchor="middle">Wann ist eine Ausübung möglich?</text><text x="178" y="128" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">Amerikanische Option</text><line x1="170" y1="150" x2="560" y2="150" stroke="#1a1a1a" stroke-width="2.2"/><path d="M564,150 l-9,-4.5 v9 z" fill="#1a1a1a"/><circle cx="235" cy="150" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><circle cx="300" cy="150" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><circle cx="365" cy="150" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><circle cx="430" cy="150" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><circle cx="495" cy="150" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="365" y="176" font-size="12" fill="#555" font-weight="400" text-anchor="middle">jederzeit bis zum Verfall ausübbar</text><text x="178" y="248" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">Europäische Option</text><line x1="170" y1="270" x2="560" y2="270" stroke="#1a1a1a" stroke-width="2.2"/><path d="M564,270 l-9,-4.5 v9 z" fill="#1a1a1a"/><circle cx="560" cy="270" r="4.2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="365" y="296" font-size="12" fill="#555" font-weight="400" text-anchor="middle">nur am Verfallstag ausübbar</text><line x1="170" y1="118" x2="170" y2="300" stroke="#cdd2d8" stroke-width="1" stroke-dasharray="4 4"/><line x1="560" y1="118" x2="560" y2="300" stroke="#cdd2d8" stroke-width="1" stroke-dasharray="4 4"/><text x="170" y="330" font-size="12" fill="#555" font-weight="400" text-anchor="middle">heute</text><text x="560" y="330" font-size="12" fill="#555" font-weight="400" text-anchor="middle">Verfall</text></svg>