<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"><rect width="720" height="440" fill="#ffffff"/><text x="360" y="92" font-size="15" fill="#1a1a1a" font-weight="600" text-anchor="middle">Rollen = Schließen + neu eröffnen</text><rect x="56" y="168" width="252" height="104" fill="none" stroke="#1a1a1a" stroke-width="1.8" rx="9"/><text x="182" y="212" font-size="15" fill="#1a1a1a" font-weight="400" text-anchor="middle">Bestehende Option</text><text x="182" y="240" font-size="12.5" fill="#555" font-weight="400" text-anchor="middle">zurückkaufen (schließen)</text><line x1="312" y1="220" x2="356" y2="220" stroke="#1a1a1a" stroke-width="2.4"/><path d="M360,220 l-13,-7 v14 z" fill="#1a1a1a"/><rect x="412" y="168" width="252" height="104" fill="none" stroke="#1a1a1a" stroke-width="1.8" rx="9"/><text x="538" y="206" font-size="15" fill="#1a1a1a" font-weight="400" text-anchor="middle">Neue Option verkaufen</text><text x="538" y="232" font-size="12.5" fill="#555" font-weight="400" text-anchor="middle">späterer Verfall</text><text x="538" y="254" font-size="12.5" fill="#555" font-weight="400" text-anchor="middle">und/oder neuer Strike</text></svg>